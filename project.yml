name: RoundPlay
options:
  bundleIdPrefix: app.roundplay
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

packages:
  RoundPlayEngine:
    path: Packages/RoundPlayEngine
  RoundPlayData:
    path: Packages/RoundPlayData

targets:
  RoundPlay:
    type: application
    platform: iOS
    sources:
      # Mocks/ holds the roundplay.app marketing site, which deploys to Cloudflare and has no
      # business inside the app bundle. Without this exclusion every page and image in it shipped
      # as a bundle resource: index.html, og.png, the 1024pt App Store icon, the favicons.
      - path: RoundPlay
        excludes:
          - "Mocks/**"
    dependencies:
      - package: RoundPlayEngine
        product: RoundPlayEngine
      - package: RoundPlayData
        product: RoundPlayData
      - sdk: WatchConnectivity.framework
      - target: RoundPlayWatch
        embed: true
        codeSign: true
    info:
      path: RoundPlay/Info.plist
      properties:
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-Black.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        NSLocationWhenInUseUsageDescription: "Find golf courses near you."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roundplay.RoundPlay
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEVELOPMENT_TEAM: XVD9C7XLM5
        CODE_SIGN_STYLE: Automatic
        # iPhone only. The layouts are portrait-first and phone-width; on a 13" iPad they
        # stretch edge to edge with phone-sized type and a third of the screen empty. iPad
        # ships when it has a layout of its own, not as a scaled-up phone.
        TARGETED_DEVICE_FAMILY: 1
  RoundPlayWatch:
    type: application
    platform: watchOS
    sources:
      - path: RoundPlayWatch
    dependencies:
      - package: RoundPlayEngine
        product: RoundPlayEngine
      - package: RoundPlayData
        product: RoundPlayData
      - sdk: WatchConnectivity.framework
    info:
      path: RoundPlayWatch/Info.plist
      properties:
        WKCompanionAppBundleIdentifier: app.roundplay.RoundPlay
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roundplay.RoundPlay.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEVELOPMENT_TEAM: XVD9C7XLM5
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 4
  RoundPlayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoundPlayTests
    dependencies:
      - target: RoundPlay
      - package: RoundPlayData
        product: RoundPlayData
      - package: RoundPlayEngine
        product: RoundPlayEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roundplay.RoundPlayTests
        SWIFT_VERSION: "6.2"
        # Without this the bundle has no Info.plist, code signing refuses it, and
        # `xcodebuild test` fails before running a single test.
        GENERATE_INFOPLIST_FILE: YES
